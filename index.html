    <script>
      // Gracefully ignore WebSocket / HMR errors in cloud preview environments
      window.addEventListener('error', function(event) {
        if (event && (
          event.message?.includes('WebSocket') ||
          event.filename?.includes('@vite/client') ||
          (event.error && String(event.error).includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && String(event.reason).includes('WebSocket')) {
          event.preventDefault();
        }
      });

      // Lock zoom on mobile (prevent pinch-to-zoom and multi-touch gesture scaling)
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      }, { passive: false });

      // Prevent iOS double-tap auto-zoom on non-input elements
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          var target = e.target;
          var tag = target && target.tagName ? target.tagName.toUpperCase() : '';
          if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, { passive: false });
    </script>
